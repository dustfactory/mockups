<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f7">
<title>키보드</title>
<style>
:root {
  color-scheme: light;
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans CJK KR", "Malgun Gothic", sans-serif;
  --paper: #faf9f7;
  --ink: #252426;
  --line: #e2dfdd;
  --accent: #625197;
  --accent-soft: #ddd6f4;
  --scale: 1;
  --base: min(38.4vw, 56.4vh, 444px);
  --available-width: calc(48vw - max(env(safe-area-inset-left, 0px), env(safe-area-inset-right, 0px)));
  --fan-width: min(calc(var(--base) * var(--scale)), var(--available-width), 70.8vh);
  --fan-height: calc(var(--fan-width) / 1.5);
  --side-pad: clamp(20px, 5vw, 84px);
}
@supports (height: 100dvh) {
  :root { --base: min(38.4vw, 56.4dvh, 444px); --fan-width: min(calc(var(--base) * var(--scale)), var(--available-width), 70.8dvh); }
}
@media (max-aspect-ratio: 1/1) {
  :root { --base: min(46vw, 444px); }
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: var(--paper); }
button, input, textarea { font: inherit; }
button, input[type="range"] { touch-action: manipulation; }
button { -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.app {
  position: relative; isolation: isolate; overflow: hidden;
  height: 100vh; height: 100dvh; display: flex; flex-direction: column;
}
.controls {
  position: absolute; z-index: 3;
  top: calc(8px + env(safe-area-inset-top));
  right: calc(12px + env(safe-area-inset-right));
}
.settings-toggle, .reset-size {
  display: grid; place-items: center; width: 44px; height: 44px;
  background: transparent; border: 0; border-radius: 50%; padding: 0;
  color: #74747a; cursor: pointer;
}
.settings-toggle:hover, .settings-toggle[aria-expanded="true"], .reset-size:hover { background: #f2f2f7; }
.settings {
  position: absolute; top: calc(100% + 4px); right: 0;
  display: flex; align-items: center; gap: 8px; width: min(216px, 80vw);
  padding: 4px 4px 4px 16px; border-radius: 14px; border: 1px solid var(--line);
  background: #fff; box-shadow: 0 4px 16px #00000010;
}
.settings[hidden] { display: none; }
.settings input { flex: 1; min-width: 0; height: 44px; margin: 0; accent-color: var(--accent); }
.reset-size { flex: none; }
.note {
  z-index: 1; display: flex; flex: 1; min-height: 0; flex-direction: column;
  padding: max(22px, calc(12px + env(safe-area-inset-top))) max(var(--side-pad), calc(68px + env(safe-area-inset-right))) 0 max(var(--side-pad), env(safe-area-inset-left));
  margin-bottom: calc(var(--fan-height) + env(safe-area-inset-bottom, 0px));
}
#editor {
  color: var(--ink); caret-color: var(--accent); background: transparent; width: 100%;
  flex: 1; min-height: 0; margin: 0; padding: 1px 0 10px; border: 0; outline: none;
  border-radius: 0; resize: none; font-size: clamp(18px, 1.9vw, 25px); line-height: 1.6;
  letter-spacing: -.028em; -webkit-appearance: none; appearance: none;
}
.fan {
  position: absolute; bottom: env(safe-area-inset-bottom, 0px);
  width: var(--fan-width); height: var(--fan-height); display: block; overflow: visible;
  z-index: 2; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.fan-left { left: env(safe-area-inset-left, 0px); }
.fan-right { right: env(safe-area-inset-right, 0px); }
.key { cursor: pointer; color: var(--ink); outline: none; }
.cap { fill: #efedea; stroke: #d8d5d4; stroke-width: 1; }
.function .cap { fill: #e7e4e3; }
.legend { font-family: inherit; font-weight: 540; font-size: 24px; fill: currentColor; pointer-events: none; }
.function .legend { font-size: 15px; font-weight: 620; }
.glyph { pointer-events: none; }
@media (hover: hover) and (pointer: fine) { .key:hover .cap { fill: #e5e0ed; } }
.key.is-pressed .cap, .key:active .cap, .key[aria-pressed="true"] .cap { fill: var(--accent-soft); stroke: #b4a7d4; }
.key:focus-visible .cap { stroke: var(--accent); stroke-width: 2.8; }
@media (prefers-contrast: more) {
  .cap { stroke: #73747a; stroke-width: 1; }
}
</style>
</head>

</main>
<script>
'use strict';
// The arrays keep individual keystrokes so Backspace can undo one component.
const HangulInput = (() => {
  const initials = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
  const vowels = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
  const finals = ' ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ';
  const vowelPairs = {
    'ㅗㅏ':'ㅘ', 'ㅗㅐ':'ㅙ', 'ㅗㅣ':'ㅚ', 'ㅜㅓ':'ㅝ',
    'ㅜㅔ':'ㅞ', 'ㅜㅣ':'ㅟ', 'ㅡㅣ':'ㅢ'
  };
  const finalPairs = {
    'ㄱㅅ':'ㄳ', 'ㄴㅈ':'ㄵ', 'ㄴㅎ':'ㄶ', 'ㄹㄱ':'ㄺ',
    'ㄹㅁ':'ㄻ', 'ㄹㅂ':'ㄼ', 'ㄹㅅ':'ㄽ', 'ㄹㅌ':'ㄾ',
    'ㄹㅍ':'ㄿ', 'ㄹㅎ':'ㅀ', 'ㅂㅅ':'ㅄ'
  };

  return class HangulInput {
    constructor() { this.reset(); }

    reset() {
      this.initial = '';
      this.vowelKeys = [];
      this.finalKeys = [];
    }

    get text() {
      const vowel = vowelPairs[this.vowelKeys.join('')] || this.vowelKeys[0];
      if (!vowel) return this.initial;
      if (!this.initial) return vowel;
      const final = finalPairs[this.finalKeys.join('')] || this.finalKeys[0] || ' ';
      return String.fromCharCode(0xac00 +
        (initials.indexOf(this.initial) * 21 + vowels.indexOf(vowel)) * 28 + finals.indexOf(final));
    }

    push(key) {
      let committed = '';
      if (key.length === 1 && vowels.includes(key)) {
        if (this.finalKeys.length) {
          // The last consonant becomes the onset of the following syllable.
          const nextInitial = this.finalKeys.pop();
          committed = this.text;
          this.reset();
          this.initial = nextInitial;
        } else if (this.vowelKeys.length && !vowelPairs[this.vowelKeys.join('') + key]) {
          committed = this.text;
          this.reset();
        }
        this.vowelKeys.push(key);
      } else if (key.length === 1 && initials.includes(key)) {
        const canClose = this.initial && this.vowelKeys.length && finals.includes(key);
        if (canClose && (!this.finalKeys.length || finalPairs[this.finalKeys.join('') + key])) {
          this.finalKeys.push(key);
        } else {
          committed = this.text;
          this.reset();
          this.initial = key;
        }
      } else {
        committed = this.text + key;
        this.reset();
      }
      return { committed, composing: this.text };
    }

    backspace() {
      if (this.finalKeys.length) this.finalKeys.pop();
      else if (this.vowelKeys.length) this.vowelKeys.pop();
      else this.initial = '';
      return this.text;
    }
  };
})();

const editor = document.querySelector('#editor');
const composer = new HangulInput();
let composingStart = -1;
let shifted = false;
let symbols = false;

const shiftedKeys = { 'ㅂ':'ㅃ', 'ㅈ':'ㅉ', 'ㄷ':'ㄸ', 'ㄱ':'ㄲ', 'ㅅ':'ㅆ', 'ㅐ':'ㅒ', 'ㅔ':'ㅖ' };
const baseOrder = [...'ㅂㅈㄷㄱㅅㅛㅕㅑㅐㅔㅁㄴㅇㄹㅎㅗㅓㅏㅣㅋㅌㅊㅍㅠㅜㅡ'];
const primarySymbols = [...'1234567890@#$%&-+()*/?!.,:'];
const extraSymbols = ['[',']','{','}','<','>','=','~','^','_', '€','£','¥','₩','×','÷','|','\\',';', '"', "'", '`','…','·','°','※'];
const keys = document.querySelectorAll('.key');
const shiftKey = document.querySelector('[data-key="shift"]');
const modeKey = document.querySelector('[data-key="mode"]');
const feedback = new WeakMap();

function labelFor(key) {
  if (symbols) return (shifted ? extraSymbols : primarySymbols)[baseOrder.indexOf(key)];
  return (shifted && shiftedKeys[key]) || key;
}

function updateLabels() {
  keys.forEach(group => {
    const key = group.dataset.key;
    if (!baseOrder.includes(key)) return;
    const label = labelFor(key);
    group.querySelector('.legend').textContent = label;
    group.setAttribute('aria-label', label);
  });
  shiftKey.setAttribute('aria-pressed', String(shifted));
  shiftKey.setAttribute('aria-label', symbols ? '추가 기호' : '쌍자음과 겹모음');
  modeKey.querySelector('.legend').textContent = symbols ? '한글' : '123';
  modeKey.setAttribute('aria-label', symbols ? '한글 자판' : '숫자와 기호 자판');
}

function endComposition() {
  composer.reset();
  composingStart = -1;
}
function checkSelection() {
  if (composingStart < 0) return;
  const end = composingStart + composer.text.length;
  if (editor.selectionStart !== end || editor.selectionEnd !== end ||
      editor.value.slice(composingStart, end) !== composer.text) endComposition();
}

function insertJamo(jamo) {
  const start = composingStart >= 0 ? composingStart : editor.selectionStart;
  const result = composer.push(jamo);
  editor.setRangeText(result.committed + result.composing, start, editor.selectionEnd, 'end');
  composingStart = result.composing ? start + result.committed.length : -1;
}

function insertLiteral(text) {
  endComposition();
  editor.setRangeText(text, editor.selectionStart, editor.selectionEnd, 'end');
}

function removePrevious() {
  const end = editor.selectionEnd;
  if (composingStart >= 0) {
    const remainder = composer.backspace();
    editor.setRangeText(remainder, composingStart, end, 'end');
    if (!remainder) composingStart = -1;
    return;
  }
  let start = editor.selectionStart;
  if (start === end && start > 0) {
    const before = editor.value.slice(0, start);
    if (typeof Intl.Segmenter === 'function') {
      const segments = new Intl.Segmenter('ko', { granularity: 'grapheme' }).segment(before);
      start = segments.containing(start - 1).index;
    } else {
      start -= [...before].pop().length;
    }
  }
  editor.setRangeText('', start, end, 'end');
}

function activate(group, usePointer) {
  checkSelection();
  // Touch stays focused on the text. Keyboard users keep focus on the chosen key.
  if (usePointer) editor.focus({ preventScroll: true });
  clearTimeout(feedback.get(group));
  group.classList.add('is-pressed');
  feedback.set(group, setTimeout(() => group.classList.remove('is-pressed'), 150));
  const key = group.dataset.key;
  if (key === 'shift') {
    shifted = !shifted;
    updateLabels();
    return;
  }
  if (key === 'mode') {
    endComposition();
    symbols = !symbols;
    shifted = false;
    updateLabels();
    return;
  }
  if (key === 'backspace') { removePrevious(); return; }
  if (key === 'space' || key === 'enter') {
    insertLiteral(key === 'space' ? ' ' : '\n');
    return;
  }
  if (symbols) insertLiteral(labelFor(key));
  else insertJamo(labelFor(key));
  if (shifted && !symbols) { shifted = false; updateLabels(); }
}

keys.forEach(group => {
  group.addEventListener('pointerdown', event => {
    // Preserve the caret/selection when either thumb touches a key.
    if (event.button === 0) event.preventDefault();
  });
  // Handle each thumb independently, including a non-primary touch.
  let lastTouchEnd = -Infinity;
  group.addEventListener('pointerup', event => {
    if (event.pointerType !== 'touch') return;
    lastTouchEnd = performance.now();
    const released = document.elementFromPoint(event.clientX, event.clientY);
    if (released && released.closest('.key') === group) activate(group, true);
  });
  group.addEventListener('click', event => {
    // iPadOS versions differ in whether click exposes the originating pointer type.
    if (event.pointerType === 'touch' ||
        (!event.pointerType && event.detail > 0 && performance.now() - lastTouchEnd < 700)) return;
    activate(group, event.detail > 0);
  });
  group.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      if (!event.repeat || group.dataset.key === 'backspace') activate(group, false);
    }
  });
});
editor.addEventListener('pointerdown', endComposition);
editor.addEventListener('beforeinput', endComposition);
editor.addEventListener('input', endComposition);
editor.addEventListener('compositionstart', endComposition);
document.addEventListener('selectionchange', checkSelection);

const toggle = document.querySelector('#settings-toggle');
const panel = document.querySelector('#settings');
const radius = document.querySelector('#radius');
function closePanel() {
  panel.hidden = true;
  toggle.setAttribute('aria-expanded', 'false');
}
toggle.addEventListener('click', () => {
  panel.hidden = !panel.hidden;
  toggle.setAttribute('aria-expanded', String(!panel.hidden));
});
function updateRadius() {
  document.documentElement.style.setProperty('--scale', String(Number(radius.value) / 100));
  radius.setAttribute('aria-valuetext', radius.value + '%');
}
radius.addEventListener('input', updateRadius);
document.querySelector('#reset-size').addEventListener('click', () => {
  radius.value = '100';
  updateRadius();
});
document.addEventListener('pointerdown', event => {
  if (!panel.hidden && !event.target.closest('.controls')) closePanel();
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && !panel.hidden) {
    closePanel();
    toggle.focus();
  }
});
updateLabels();
updateRadius();

</script>
