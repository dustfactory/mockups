<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>목업</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#1d1d1b;--muted:#6b6b66;--line:#e4e4df;--radius:12px;--gap:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:48px 20px}
h1{font-size:28px;margin:0 0 24px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:var(--gap)}
a{display:block;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);color:inherit;text-decoration:none}
a:hover{border-color:var(--muted)}
.name{font-weight:600;font-size:17px}
.desc{color:var(--muted);font-size:14px;margin-top:4px}
</style>
</head>
<body>
<main>
<h1>목업</h1>
<ul>
<li><a href="radial-split-keyboard/"><div class="name">Radial Split 한글 키보드</div><div class="desc">좌우 분할 방사형 배치의 한글 키보드 입력 목업</div></a></li>
</ul>
</main>
</body>
</html>
